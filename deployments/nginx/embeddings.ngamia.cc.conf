# Nginx server block for embeddings.ngamia.cc (host nginx + certbot).
#
# Install:
#   sudo cp deployments/nginx/embeddings.ngamia.cc.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/embeddings.ngamia.cc.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d embeddings.ngamia.cc
#
# The gateway listens on 127.0.0.1:8090 (see docker-compose.yml).

# Outer per-IP guard. Tune to taste; the gateway enforces per-app limits.
limit_req_zone $binary_remote_addr zone=embed_perip:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name embeddings.ngamia.cc;

    # certbot manages the redirect to https once TLS is issued.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name embeddings.ngamia.cc;

    # certbot fills these in; shown for completeness.
    ssl_certificate     /etc/letsencrypt/live/embeddings.ngamia.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/embeddings.ngamia.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Data plane: bodies up to 25 MB, generous read timeout for media.
    client_max_body_size 25m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Never expose metrics or engine internals.
    location = /metrics {
        deny all;
        return 403;
    }

    # Control plane: allow-list your admin IPs only.
    location /admin/ {
        allow 127.0.0.1;
        # allow <your.admin.ip>;   # <- add your IPs
        deny all;

        limit_req zone=embed_perip burst=20 nodelay;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8090;
    }

    location / {
        limit_req zone=embed_perip burst=40 nodelay;

        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://127.0.0.1:8090;
    }
}
